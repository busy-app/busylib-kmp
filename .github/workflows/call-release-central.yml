name: Maven Central release
on:
  workflow_call:
    inputs:
      VERSION_NAME:
        description: "Version name of the published artifacts"
        required: true
        type: string
      VERSION_CODE:
        description: "Version code of the published artifacts"
        required: true
        type: string
      FLAVOR_TYPE:
        description: "Value of the current_flavor_type Gradle property"
        required: true
        type: string
    secrets:
      ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME:
        description: "Maven Central user name"
        required: true
      ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD:
        description: "Maven Central password"
        required: true
      ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY:
        description: "PGP key that signs the publications"
        required: true
      ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID:
        description: "ID of the signing PGP key"
        required: true
      ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD:
        description: "Password of the signing PGP key"
        required: true

jobs:
  publish_central:
    name: Publish to Maven Central
    runs-on: [ self-hosted, macOS ]
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
      ORG_GRADLE_PROJECT_current_flavor_type: ${{ inputs.FLAVOR_TYPE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: ./.github/actions/setup-java
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Pin to 16.0 (v3 default) — cmdline-tools 20.0 crashes on self-hosted macOS runners
          cmdline-tools-version: '12266719'
          # TODO: remove once the action stops requesting the 'tools' package,
          #  which Google removed from the SDK repo on 2026-09-15
          #  https://github.com/android-actions/setup-android/issues/537
          packages: 'platform-tools'
      - name: Set version in gradle.properties
        run: |
          sed -i -e 's/^klibs.project.version.string=.*$/klibs.project.version.string=${{ inputs.VERSION_NAME }}/g' gradle.properties
          sed -i -e 's/^klibs.project.version.code=.*$/klibs.project.version.code=${{ inputs.VERSION_CODE }}/g' gradle.properties
      - name: Publish to Maven Central
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          arguments: publishAndReleaseToMavenCentral --stacktrace
