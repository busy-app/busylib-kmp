name: Sample build
on:
  workflow_call:

jobs:
  sample_cmp_build_jvm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "JVM"
            task: ":sample:cmp:jvmJar"
          - name: "Android"
            task: ":sample:android:assembleDebug"
    name: Build sample (${{ matrix.name }})
    runs-on: [ self-hosted, Linux, Android ]
    env:
      ORG_GRADLE_PROJECT_current_flavor_type: DEBUG
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: ./.github/actions/setup-java
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Pin to 16.0 (v3 default) — cmdline-tools 20.0 crashes on self-hosted macOS runners
          cmdline-tools-version: '12266719'
          # TODO: remove once the action stops requesting the 'tools' package,
          #  which Google removed from the SDK repo on 2026-09-15
          #  https://github.com/android-actions/setup-android/issues/537
          packages: 'platform-tools'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build ${{ matrix.task }}
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          arguments: ${{ matrix.task }} --stacktrace
  sample_cmp_build_apple:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Compose Multiplatform no longer ships x64 Apple targets, so the sample links arm64 only
          - name: "iOS"
            task: ":sample:cmp:linkDebugFrameworkIosArm64 :sample:cmp:linkDebugFrameworkIosSimulatorArm64"
          - name: "macOS"
            task: ":sample:cmp:linkDebugFrameworkMacosArm64"
    name: Build sample (${{ matrix.name }})
    runs-on: [ self-hosted, macOS ]
    env:
      ORG_GRADLE_PROJECT_current_flavor_type: DEBUG
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: ./.github/actions/setup-java
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Pin to 16.0 (v3 default) — cmdline-tools 20.0 crashes on self-hosted macOS runners
          cmdline-tools-version: '12266719'
          # TODO: remove once the action stops requesting the 'tools' package,
          #  which Google removed from the SDK repo on 2026-09-15
          #  https://github.com/android-actions/setup-android/issues/537
          packages: 'platform-tools'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build ${{ matrix.task }}
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          arguments: ${{ matrix.task }} --stacktrace
