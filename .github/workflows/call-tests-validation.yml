name: "Tests"
on:
  workflow_call:

jobs:
  tests:
    strategy:
      matrix:
        target:
          - "allTests"
    name: "Run tests"
    runs-on: [ self-hosted, macOS ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Set up JDK 1.21
        uses: ./.github/actions/setup-java
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # Pin to 16.0 (v3 default) — cmdline-tools 20.0 crashes on self-hosted macOS runners
          cmdline-tools-version: '12266719'
          # TODO: remove once the action stops requesting the 'tools' package,
          #  which Google removed from the SDK repo on 2026-09-15
          #  https://github.com/android-actions/setup-android/issues/537
          packages: 'platform-tools'
      - name: Give gradle permission
        run: chmod +x gradlew
      - name: Run tests
        timeout-minutes: 30
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3
        with:
          arguments: ${{ matrix.target }} --stacktrace