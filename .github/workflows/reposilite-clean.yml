name: Clean Reposilite

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 09:00 UTC
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Delete artifacts older than N days"
        default: "30"
        type: string

jobs:
  scan:
    name: "Scan: ${{ matrix.repo }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [releases, snapshots]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Scan for old artifacts
        env:
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: |
          python .github/workflows/reposilite-cleaner/scan.py \
            --repo ${{ matrix.repo }} \
            --max-age-days ${{ github.event.inputs.max_age_days || '30' }} \
            --exclude-file .github/workflows/reposilite-cleaner/exclude.txt \
            --output scan_result.csv \
            --cleanup-output cleanup_dirs.csv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scan-${{ matrix.repo }}
          path: scan_result.csv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cleanup-${{ matrix.repo }}
          path: cleanup_dirs.csv

  delete:
    name: "Delete: ${{ matrix.repo }}"
    needs: scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [releases, snapshots]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scan-${{ matrix.repo }}
      - name: Delete old artifacts
        env:
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: python .github/workflows/reposilite-cleaner/delete.py --repo ${{ matrix.repo }} --input scan_result.csv

  cleanup:
    name: "Cleanup: ${{ matrix.repo }}"
    needs: scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [releases, snapshots]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cleanup-${{ matrix.repo }}
      - name: Remove empty directories
        env:
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: python .github/workflows/reposilite-cleaner/cleanup.py --repo ${{ matrix.repo }} --input cleanup_dirs.csv

  report:
    name: "Cleanup Report"
    needs: [delete, cleanup]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Generate report
        run: |
          python .github/workflows/reposilite-cleaner/report.py \
            --artifacts-dir artifacts \
            --output report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
