name: Reposilite cleanup

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 09:00 UTC
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Delete artifacts older than N days"
        default: "30"
        type: string

jobs:
  scan:
    name: Scan ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [releases, snapshots]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Scan for old artifacts
        env:
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: |
          python .github/workflows/reposilite-cleaner/scan.py \
            --repo ${{ matrix.repo }} \
            --max-age-days ${{ github.event.inputs.max_age_days || '30' }} \
            --exclude-file .github/workflows/reposilite-cleaner/exclude.txt \
            --output scan_result.csv \
            --cleanup-output cleanup_dirs.csv
      - name: Upload scan result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-${{ matrix.repo }}
          path: scan_result.csv
      - name: Upload cleanup list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cleanup-${{ matrix.repo }}
          path: cleanup_dirs.csv

  delete:
    name: Delete old artifacts in ${{ matrix.repo }}
    needs: scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [releases, snapshots]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download scan result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scan-${{ matrix.repo }}
      - name: Delete old artifacts
        env:
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: python .github/workflows/reposilite-cleaner/delete.py --repo ${{ matrix.repo }} --input scan_result.csv

  cleanup:
    name: Remove empty directories in ${{ matrix.repo }}
    needs: scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [releases, snapshots]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download cleanup list
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cleanup-${{ matrix.repo }}
      - name: Remove empty directories
        env:
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: python .github/workflows/reposilite-cleaner/cleanup.py --repo ${{ matrix.repo }} --input cleanup_dirs.csv

  report:
    name: Cleanup report
    needs: [delete, cleanup]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download all results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Generate report
        run: |
          python .github/workflows/reposilite-cleaner/report.py \
            --artifacts-dir artifacts \
            --output report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
